# Wallbox knob display – ESPHome package
# Works with any charge controller that exposes its values and a mode select in
# Home Assistant. The defaults are set up for evcc.
# Board: VIEWE UEDX24240013-MD50E (ESP32-C3, 1.28" GC9A01 240x240, rotary knob)
# Pins as documented by the HA community / dmit2k/viewe-knob-display-esphome
#
# Include this file from your own device config via `packages:` (see example.yaml)
# and override the substitutions below to match your Home Assistant entities.
#
# Operation: turn = preselect charge mode (orange), press = send it to the charge controller.
# An unconfirmed selection expires after 8 s.
#
# Display timeout: adjustable in Home Assistant as "Display Timeout" (seconds),
# 0 = never off. While the display is off, turning or pressing only wakes it up
# without changing the charge mode.
#
# Screen:
#   - ring along the edge: wallbox charge power, 0..max_charge_kw over 270° (green)
#       while charging the ring fills up animated to the current charge power
#   - left: home battery (house icon), right: vehicle battery (car icon)
#       charging:    bar fills up animated from the bottom to the SoC
#       discharging: bar drains animated from the SoC downwards (home battery only)
#       the animation pauses while a mode selection is pending (button has priority)
#   - centre: solar panel icon + PV power,
#             evcc logo or charging station icon + charge power,
#             charge mode
#   - bottom: 3 bolts = phases (filled = phase in use, outline = unused)

substitutions:
  # ---- Home Assistant entities (override these in your device config; defaults: evcc)
  entity_pv_power: sensor.evcc_pv_power                    # PV power
  entity_charge_power: sensor.evcc_garage_charge_power     # loadpoint charge power
  entity_charging: binary_sensor.evcc_garage_charging      # loadpoint is charging
  entity_mode: select.evcc_garage_mode                     # loadpoint mode select
  entity_phases_active: sensor.evcc_garage_phases_active   # active phases (1..3)
  entity_car_soc: sensor.evcc_garage_vehicle_soc           # vehicle SoC in %
  entity_home_batt_soc: sensor.evcc_battery_soc            # home battery SoC in %
  entity_home_batt_power: sensor.evcc_battery_power        # home battery power in W

  # ---- Units and signs
  pv_power_divisor: "1000.0"      # PV sensor value / divisor = kW (W sensor -> 1000)
  charge_power_divisor: "1.0"     # charge sensor value / divisor = kW (W sensor -> 1000)
  home_batt_power_factor: "1.0"   # result must be negative while charging; use -1.0 to flip

  # ---- Values of the mode select (as offered by your entity_mode)
  mode_off_option: "off"
  mode_smart_option: "smart"
  mode_now_option: "now"

  # ---- Texts on the display (available: A-Z, a-z, Ä Ö Ü ä ö ü ß, digits and " ?=.-")
  label_off: "Off"
  label_smart: "Smart"
  label_now: "Fast"
  label_confirm: "Press = OK"

  # ---- Look and behaviour
  charge_icon: "evcc"             # "evcc" = evcc logo, "wallbox" = charging station icon
  max_charge_kw: "22.0"           # full scale of the ring
  anim_steps: "8"                 # animation steps (x 400 ms)
  batt_threshold_w: "50.0"        # battery counts as (dis)charging above this power
  wake_guard_ms: "600"            # knob steps right after waking up are ignored this long
  display_timeout_default: "120"  # initial display timeout in s (changeable in HA)
  backlight_name: "Display Backlight"     # name of the backlight entity in HA
  timeout_name: "Display Timeout"         # name of the timeout entity in HA

esphome:
  on_boot:
    priority: -100
    then:
      - script.execute: wake_up

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

logger:

captive_portal:

# ---------------------------------------------------------------- State
globals:
  # index into MODES (0=off, 1=smart, 2=now), -1 = no selection pending
  - id: pending_idx
    type: int
    initial_value: "-1"
  # current mode according to the charge controller, -1 = unknown
  - id: current_mode_idx
    type: int
    initial_value: "-1"
  # animation counter (battery bars and charge ring)
  - id: anim_step
    type: int
    initial_value: "0"
  # time (millis) of the last wake-up from the off state
  - id: woke_at
    type: uint32_t
    initial_value: "0"

# ---------------------------------------------------------------- Setting in Home Assistant
number:
  - platform: template
    id: display_timeout
    name: "${timeout_name}"
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: s
    mode: box
    min_value: 0
    max_value: 3600
    step: 10
    initial_value: ${display_timeout_default}
    restore_value: true
    optimistic: true
    on_value:
      - script.execute: wake_up

# ---------------------------------------------------------------- Data from Home Assistant
sensor:
  - platform: homeassistant
    id: pv_power
    entity_id: ${entity_pv_power}
  - platform: homeassistant
    id: charge_power
    entity_id: ${entity_charge_power}
  - platform: homeassistant
    id: home_batt_soc
    entity_id: ${entity_home_batt_soc}
  - platform: homeassistant
    id: home_batt_power
    entity_id: ${entity_home_batt_power}
  - platform: homeassistant
    id: car_soc
    entity_id: ${entity_car_soc}
  - platform: homeassistant
    id: phases_active
    entity_id: ${entity_phases_active}

  # Knob: if the display is off, only wake it up. Right after waking up,
  # further steps of the same turn are ignored.
  - platform: rotary_encoder
    id: knob
    pin_a: GPIO6
    pin_b: GPIO7
    resolution: 2
    on_clockwise:
      - if:
          condition:
            light.is_off: backlight
          then:
            - lambda: 'id(woke_at) = millis();'
            - script.execute: wake_up
          else:
            - if:
                condition:
                  lambda: 'return millis() - id(woke_at) > ${wake_guard_ms};'
                then:
                  - lambda: |-
                      int cur = id(pending_idx) >= 0 ? id(pending_idx) : id(current_mode_idx);
                      if (cur < 0) cur = 0;
                      id(pending_idx) = (cur + 1) % 3;
                  - script.execute: pending_timeout
            - script.execute: wake_up
    on_anticlockwise:
      - if:
          condition:
            light.is_off: backlight
          then:
            - lambda: 'id(woke_at) = millis();'
            - script.execute: wake_up
          else:
            - if:
                condition:
                  lambda: 'return millis() - id(woke_at) > ${wake_guard_ms};'
                then:
                  - lambda: |-
                      int cur = id(pending_idx) >= 0 ? id(pending_idx) : id(current_mode_idx);
                      if (cur < 0) cur = 0;
                      id(pending_idx) = (cur + 2) % 3;
                  - script.execute: pending_timeout
            - script.execute: wake_up

text_sensor:
  - platform: homeassistant
    id: ev_mode
    entity_id: ${entity_mode}
    on_value:
      - lambda: |-
          if (x == "${mode_off_option}") id(current_mode_idx) = 0;
          else if (x == "${mode_smart_option}") id(current_mode_idx) = 1;
          else if (x == "${mode_now_option}") id(current_mode_idx) = 2;
          else id(current_mode_idx) = -1;
      - component.update: disp

binary_sensor:
  - platform: homeassistant
    id: ev_charging
    entity_id: ${entity_charging}

  # Button: reacts immediately on press (no delayed_on), debounced on release only.
  # If the display is off, a press only wakes it up.
  - platform: gpio
    id: knob_button
    pin:
      number: GPIO9
      inverted: true
      ignore_strapping_warning: true
    use_interrupt: true
    filters:
      - delayed_off: 30ms
    on_press:
      - if:
          condition:
            light.is_off: backlight
          then:
            - lambda: 'id(woke_at) = millis();'
            - script.execute: wake_up
          else:
            - if:
                condition:
                  lambda: 'return id(pending_idx) >= 0;'
                then:
                  - homeassistant.action:
                      action: select.select_option
                      data:
                        entity_id: ${entity_mode}
                        option: !lambda |-
                          static const char *const MODES[] = {
                            "${mode_off_option}", "${mode_smart_option}", "${mode_now_option}"};
                          return std::string(MODES[id(pending_idx)]);
                  - lambda: 'id(pending_idx) = -1;'
                  - script.stop: pending_timeout
            - script.execute: wake_up

# ---------------------------------------------------------------- Animation (batteries + ring)
# Only while the display is on, a battery is (dis)charging or the wallbox is
# charging, and no mode selection is pending: one step every 400 ms.
interval:
  - interval: 400ms
    then:
      - if:
          condition:
            lambda: |-
              if (!id(backlight).current_values.is_on()) return false;
              if (id(pending_idx) >= 0) return false;
              bool car = id(ev_charging).state;
              float hp = id(home_batt_power).state;
              bool home = !isnan(hp) && fabsf(hp) > ${batt_threshold_w};
              return car || home;
          then:
            - lambda: 'id(anim_step) = (id(anim_step) + 1) % (${anim_steps} + 3);'
            - component.update: disp

# ---------------------------------------------------------------- Helpers
script:
  # discard the selection if it is not confirmed within 8 s
  - id: pending_timeout
    mode: restart
    then:
      - delay: 8s
      - lambda: 'id(pending_idx) = -1;'
      - component.update: disp
  # switch the display on and off again after "Display Timeout" (0 = stays on)
  - id: wake_up
    mode: restart
    then:
      - light.turn_on:
          id: backlight
          brightness: 100%
          transition_length: 200ms
      - component.update: disp
      - if:
          condition:
            lambda: 'return id(display_timeout).state > 0;'
          then:
            - delay: !lambda 'return (uint32_t) (id(display_timeout).state * 1000.0f);'
            - lambda: 'id(pending_idx) = -1;'
            - script.stop: pending_timeout
            - light.turn_off:
                id: backlight
                transition_length: 1s

# ---------------------------------------------------------------- Display hardware
spi:
  clk_pin: GPIO1
  mosi_pin: GPIO0

output:
  - platform: ledc
    id: backlight_pwm
    pin:
      number: GPIO8
      inverted: true
      ignore_strapping_warning: true
    frequency: 5000Hz

light:
  - platform: monochromatic
    id: backlight
    name: "${backlight_name}"
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

font:
  - file: "gfonts://Roboto"
    id: f_tiny
    size: 14
    glyphs: " ?=.-ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÄÖÜäöüß"
  - file: "gfonts://Roboto@700"
    id: f_mid
    size: 28
    glyphs: " -.,0123456789kW"
  - file: "gfonts://Roboto@700"
    id: f_mode
    size: 26
    glyphs: " ?=.-ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÄÖÜäöüß"

color:
  - id: c_pv
    hex: FFC107
  - id: c_charge
    hex: 4CAF50
  - id: c_grey
    hex: 9E9E9E
  - id: c_track
    hex: 2A2A2A
  - id: c_off
    hex: 757575
  - id: c_smart
    hex: 2196F3
  - id: c_now
    hex: F44336
  - id: c_pending
    hex: FF9800
  - id: c_batt_low
    hex: F44336
  - id: c_batt_mid
    hex: FFC107
  - id: c_batt_high
    hex: 4CAF50
  - id: c_phase
    hex: FFD600
  - id: c_evcc
    hex: 0FDE41

# mipi_spi instead of ili9xxx: small partial buffer (<20 KB) instead of a 115 KB
# full frame, so the ESP32-C3 (no PSRAM) keeps enough RAM for WiFi/API.
display:
  - platform: mipi_spi
    id: disp
    model: GC9A01A
    cs_pin: GPIO10
    dc_pin: GPIO4
    reset_pin:
      number: GPIO2
      ignore_strapping_warning: true
    invert_colors: true
    data_rate: 20MHz
    update_interval: 2s
    lambda: |-
      const int cx = 120, cy = 120;
      int cur = id(current_mode_idx);
      bool charging = id(ev_charging).state;
      float charge_kw = id(charge_power).state / ${charge_power_divisor};

      // home battery: +1 = charging, -1 = discharging, 0 = idle
      float hb_pow = id(home_batt_power).state * ${home_batt_power_factor};
      int home_dir = 0;
      if (!isnan(hb_pow)) {
        if (hb_pow < -${batt_threshold_w}) home_dir = 1;
        else if (hb_pow > ${batt_threshold_w}) home_dir = -1;
      }

      // animation progress 0..1 (holds briefly at the end)
      int st = id(anim_step);
      if (st > ${anim_steps}) st = ${anim_steps};
      float anim_frac = (float) st / ${anim_steps};

      // --- ring: charge power 0..max_charge_kw over 270°
      //     starts bottom left (135°), clockwise to bottom right (45°)
      //     while charging the ring fills up animated to the current power.
      //     coordinates are computed once (saves time per frame).
      {
        const int N = 541;                          // 0.5° steps over 270°
        static int16_t xi[N], yi[N], xo[N], yo[N];
        static bool ring_init = false;
        if (!ring_init) {
          for (int i = 0; i < N; i++) {
            float a = (135.0f + i * 0.5f) * M_PI / 180.0f;
            float c = cosf(a), s = sinf(a);
            xi[i] = cx + lroundf(110.0f * c);  yi[i] = cy + lroundf(110.0f * s);
            xo[i] = cx + lroundf(119.0f * c);  yo[i] = cy + lroundf(119.0f * s);
          }
          ring_init = true;
        }
        float frac = isnan(charge_kw) ? 0.0f : charge_kw / ${max_charge_kw};
        if (frac < 0) frac = 0;
        if (frac > 1) frac = 1;
        if (charging) frac *= anim_frac;
        int lit = frac > 0 ? (int) (frac * (N - 1) + 0.5f) : -1;
        for (int i = 0; i < N; i++)
          it.line(xi[i], yi[i], xo[i], yo[i], i <= lit ? id(c_charge) : id(c_track));
      }

      // --- small icons, mx = centre, ty = top edge
      auto draw_house = [&](int mx, int ty) {            // approx. 19 x 15 px
        Color g = id(c_grey);
        it.filled_triangle(mx - 9, ty + 7, mx, ty, mx + 9, ty + 7, g);   // roof
        it.filled_rectangle(mx - 6, ty + 7, 13, 8, g);                    // wall
        it.filled_rectangle(mx - 1, ty + 10, 3, 5, Color::BLACK);         // door
      };
      auto draw_car = [&](int mx, int ty) {              // approx. 19 x 14 px
        Color g = id(c_grey);
        it.filled_rectangle(mx - 9, ty + 5, 19, 6, g);                    // body
        it.filled_triangle(mx - 6, ty + 5, mx - 3, ty + 1, mx - 3, ty + 5, g);
        it.filled_rectangle(mx - 3, ty + 1, 7, 4, g);                     // roof
        it.filled_triangle(mx + 4, ty + 1, mx + 7, ty + 5, mx + 4, ty + 5, g);
        it.filled_circle(mx - 5, ty + 11, 3, Color::BLACK);               // wheels
        it.filled_circle(mx - 5, ty + 11, 2, g);
        it.filled_circle(mx + 6, ty + 11, 3, Color::BLACK);
        it.filled_circle(mx + 6, ty + 11, 2, g);
      };
      auto draw_solar = [&](int mx, int ty, Color col) {  // approx. 24 x 17 px
        // tilted panel as a parallelogram
        int tl = mx - 8, tr = mx + 12, bl = mx - 12, br = mx + 8, h = 12;
        it.filled_triangle(tl, ty, tr, ty, br, ty + h, col);
        it.filled_triangle(tl, ty, br, ty + h, bl, ty + h, col);
        // cell grid: 2 horizontal, 2 slanted separators
        for (int k = 1; k <= 2; k++) {
          int yy = ty + k * h / 3;
          int xl = tl - (yy - ty) * 4 / h, xr = tr - (yy - ty) * 4 / h;
          it.line(xl, yy, xr, yy, Color::BLACK);
          int xt = tl + k * (tr - tl) / 3, xb = bl + k * (br - bl) / 3;
          it.line(xt, ty, xb, ty + h, Color::BLACK);
        }
        // stand
        it.line(mx, ty + h, mx, ty + h + 4, col);
        it.line(mx - 4, ty + h + 4, mx + 4, ty + h + 4, col);
      };
      // evcc logo (approx. 70 x 19 px): "ev" + green bolt + "cc", bolt centred on mx
      auto draw_evcc = [&](int mx, int ty) {
        Color g = id(c_evcc);
        it.filled_triangle(mx + 0, ty + 0, mx + 5, ty + 0, mx - 5, ty + 10, g);
        it.filled_triangle(mx + 5, ty + 0, mx + 1, ty + 7, mx - 5, ty + 10, g);
        it.filled_triangle(mx - 5, ty + 10, mx + 1, ty + 7, mx + 5, ty + 7, g);
        it.filled_triangle(mx - 5, ty + 10, mx + 5, ty + 7, mx + 0, ty + 10, g);
        it.filled_triangle(mx + 5, ty + 7, mx - 2, ty + 18, mx + 0, ty + 10, g);
        it.print(mx - 6, ty + 16, id(f_mode), Color::WHITE, TextAlign::BASELINE_RIGHT, "ev");
        it.print(mx + 8, ty + 16, id(f_mode), Color::WHITE, TextAlign::BASELINE_LEFT, "cc");
      };
      // charging station with bolt and cable (approx. 19 x 20 px)
      auto draw_wallbox = [&](int mx, int ty, Color col) {
        it.filled_rectangle(mx - 8, ty, 11, 18, col);                     // pillar
        it.filled_rectangle(mx - 10, ty + 18, 15, 2, col);                // base
        it.filled_triangle(mx - 1, ty + 3, mx - 6, ty + 10, mx - 2, ty + 10, Color::BLACK);
        it.filled_triangle(mx - 4, ty + 8, mx + 1, ty + 8, mx - 5, ty + 15, Color::BLACK);
        it.line(mx + 3, ty + 5, mx + 7, ty + 5, col);                     // cable
        it.line(mx + 3, ty + 6, mx + 7, ty + 6, col);
        it.line(mx + 6, ty + 5, mx + 6, ty + 13, col);
        it.line(mx + 7, ty + 5, mx + 7, ty + 13, col);
        it.filled_rectangle(mx + 5, ty + 13, 4, 5, col);                  // plug
      };

      // --- battery: x = left edge, soc in %, icon below
      //     dir = +1: bar fills up animated from the bottom to the SoC
      //     dir = -1: bar drains animated from the SoC downwards
      //     dir =  0: static
      auto draw_batt = [&](int x, float soc, bool is_car, int dir) {
        const int w = 22, h = 60, y = 80;        // body
        const int cap_w = 10, cap_h = 5;         // terminal
        it.filled_rectangle(x + (w - cap_w) / 2, y - cap_h, cap_w, cap_h, id(c_grey));
        it.rectangle(x, y, w, h, id(c_grey));
        it.rectangle(x + 1, y + 1, w - 2, h - 2, id(c_grey));
        if (!isnan(soc)) {
          float s = soc < 0 ? 0 : (soc > 100 ? 100 : soc);
          int inner = h - 6;
          int fill = (int) (inner * s / 100.0f + 0.5f);
          if (dir > 0)      fill = (int) (fill * anim_frac + 0.5f);
          else if (dir < 0) fill = (int) (fill * (1.0f - anim_frac) + 0.5f);
          Color c = s < 20 ? id(c_batt_low) : (s < 50 ? id(c_batt_mid) : id(c_batt_high));
          if (fill > 0)
            it.filled_rectangle(x + 3, y + 3 + inner - fill, w - 6, fill, c);
        }
        if (is_car) draw_car(x + w / 2, y + h + 6);
        else        draw_house(x + w / 2, y + h + 6);
      };
      draw_batt(30, id(home_batt_soc).state, false, home_dir);
      draw_batt(188, id(car_soc).state, true, charging ? 1 : 0);

      // --- PV power in kW with solar panel icon
      draw_solar(cx, 32, id(c_pv));
      if (isnan(id(pv_power).state))
        it.print(cx, 56, id(f_mid), id(c_pv), TextAlign::TOP_CENTER, "--");
      else
        it.printf(cx, 56, id(f_mid), id(c_pv), TextAlign::TOP_CENTER, "%.1f kW",
                  id(pv_power).state / ${pv_power_divisor});

      // --- charge power in kW with evcc logo or charging station icon
      if (std::string("${charge_icon}") == "wallbox")
        draw_wallbox(cx, 97, charging ? id(c_charge) : id(c_grey));
      else
        draw_evcc(cx, 98);
      if (isnan(charge_kw))
        it.print(cx, 124, id(f_mid), id(c_charge), TextAlign::TOP_CENTER, "--");
      else
        it.printf(cx, 124, id(f_mid), id(c_charge), TextAlign::TOP_CENTER, "%.1f kW", charge_kw);

      // --- charge mode
      static const char *const LABELS[] = {"${label_off}", "${label_smart}", "${label_now}"};
      int pend = id(pending_idx);

      if (pend >= 0) {
        it.printf(cx, 166, id(f_mode), id(c_pending), TextAlign::TOP_CENTER, "%s ?", LABELS[pend]);
        it.print(cx, 194, id(f_tiny), id(c_grey), TextAlign::TOP_CENTER, "${label_confirm}");
      } else {
        Color mc = cur == 0 ? id(c_off) : (cur == 1 ? id(c_smart) : (cur == 2 ? id(c_now) : id(c_grey)));
        it.filled_rectangle(72, 166, 96, 30, mc);
        it.print(cx, 181, id(f_mode), Color::WHITE, TextAlign::CENTER,
                 cur >= 0 ? LABELS[cur] : "?");

        // --- phases: 3 bolts below the mode
        //     filled = phase in use, outline only = unused
        int n_active = 0;
        if (charging && !isnan(id(phases_active).state))
          n_active = (int) id(phases_active).state;

        // bolt outline (12 x 18 px), points A..G clockwise
        static const int BX[] = {5, 12, 7, 12, 2, 5, 0};
        static const int BY[] = {0, 0, 7, 7, 18, 10, 10};
        auto draw_bolt = [&](int x0, int y0, bool filled) {
          #define P(i) x0 + BX[i], y0 + BY[i]
          if (filled) {
            it.filled_triangle(P(0), P(1), P(6), id(c_phase));   // A B G
            it.filled_triangle(P(1), P(2), P(6), id(c_phase));   // B C G
            it.filled_triangle(P(2), P(5), P(6), id(c_phase));   // C F G
            it.filled_triangle(P(2), P(3), P(5), id(c_phase));   // C D F
            it.filled_triangle(P(3), P(4), P(5), id(c_phase));   // D E F
          }
          for (int i = 0; i < 7; i++) {
            int j = (i + 1) % 7;
            it.line(x0 + BX[i], y0 + BY[i], x0 + BX[j], y0 + BY[j], id(c_phase));
          }
          #undef P
        };
        const int bw = 12, gap = 8, by = 201;
        int bx = cx - (3 * bw + 2 * gap) / 2;
        for (int p = 0; p < 3; p++)
          draw_bolt(bx + p * (bw + gap), by, p < n_active);
      }
