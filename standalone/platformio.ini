; Wallbox knob display – standalone firmware (no ESPHome / Home Assistant)
; Talks directly to the evcc REST API.
; Board: VIEWE UEDX24240013-MD50E (ESP32-C3, GC9A01 240x240, rotary knob)

[env:wallbox-knob]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
  -DFW_VERSION=\"0.1.0\"
lib_deps =
  lovyan03/LovyanGFX@^1.1.16
  bblanchon/ArduinoJson@^7.2.0
; writes bin/wallbox-knob-<version>-full.bin (flash at 0x0) and -ota.bin after every build
extra_scripts = post:scripts/merge_bin.py

; After the first USB flash, updates can go over the air:
;   pio run -e wallbox-knob-ota -t upload
[env:wallbox-knob-ota]
extends = env:wallbox-knob
upload_protocol = espota
upload_port = wallbox-knob.local
; upload_flags = --auth=YOUR-ADMIN-PASSWORD
