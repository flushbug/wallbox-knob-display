; Wallbox knob display – standalone firmware (no ESPHome / Home Assistant)
; Talks directly to the evcc REST API.
; Boards:
;   wallbox-knob  VIEWE UEDX24240013-MD50E (ESP32-C3, GC9A01 240x240 round, rotary knob)
;   tdisplay-s3   LilyGO T-Display-S3 (ESP32-S3, ST7789 170x320, two buttons)

[env:wallbox-knob]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
  -DFW_VERSION=\"0.2.1\"
lib_deps =
  lovyan03/LovyanGFX@^1.1.16
  bblanchon/ArduinoJson@^7.2.0
; writes bin/<custom_image_name>-<version>-full.bin (flash at 0x0) and -ota.bin after every build
extra_scripts = post:scripts/merge_bin.py
custom_image_name = wallbox-knob

; After the first USB flash, updates can go over the air:
;   pio run -e wallbox-knob-ota -t upload
[env:wallbox-knob-ota]
extends = env:wallbox-knob
upload_protocol = espota
upload_port = wallbox-knob.local
; upload_flags = --auth=YOUR-ADMIN-PASSWORD

[env:tdisplay-s3]
extends = env:wallbox-knob
board = lilygo-t-display-s3
board_build.partitions = default_16MB.csv
build_flags =
  ${env:wallbox-knob.build_flags}
  -DBOARD_TDISPLAY_S3
custom_image_name = tdisplay-s3

[env:tdisplay-s3-ota]
extends = env:tdisplay-s3
upload_protocol = espota
upload_port = wallbox-display.local
